name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Could not detect active Java major version." >&2
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version is $JAVA_MAJOR. Required version is 17 or newer." >&2
            exit 1
          fi

          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_FILE="./debug.keystore"
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Keystore $KEYSTORE_FILE already exists, skipping generation."
          else
            echo "Generating temporary debug keystore at $KEYSTORE_FILE..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore $KEYSTORE_FILE does not exist after generation attempt." >&2
            exit 1
          fi

          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Verifying debug APK at: $TARGET_APK"

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected debug APK $TARGET_APK not found!" >&2
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Debug APK $TARGET_APK exists but is empty (0 bytes)!" >&2
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: Target file does not have .apk extension!" >&2; exit 1 ;;
          esac

          echo "Debug APK verified successfully: $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          TEMP_RELEASE_DIR=$(mktemp -d /tmp/release-asset-XXXXXX)
          
          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_FILEPATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "$TARGET_APK" "$RELEASE_FILEPATH"

          if [ ! -s "$RELEASE_FILEPATH" ]; then
            echo "ERROR: Failed to prepare release asset at $RELEASE_FILEPATH" >&2
            exit 1
          fi

          echo "Release asset prepared: $RELEASE_FILEPATH"
          echo "asset_path=${RELEASE_FILEPATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH does not exist or is empty." >&2
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset $ASSET_PATH is not an .apk file!" >&2; exit 1 ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Creating GitHub Release with tag: $TAG_NAME"

          cat << 'EOF' > /tmp/release_notes.md
          ### Automated Debug APK Build

          This is an automatically generated debug APK build.

          - **Build Run Number:** ${{ github.run_number }}
          - **Build Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Built By:** GitHub Actions
          - **File Name:** ${{ steps.prepare_asset.outputs.asset_name }}

          > **Notice:** This APK is signed exclusively with a temporary debug keystore and is intended for testing purposes only. It is not a production release intended for the Google Play Store.
          EOF

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes-file /tmp/release_notes.md

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG_NAME" || true
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}")

            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "### 🚀 Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was built and published successfully!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Tag:** \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Filename:** \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📲 **Download Instructions:** You can download the APK directly on your phone from the **Assets** section of the release page linked above." >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available in the run summary as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK build and artifact upload succeeded!"
            echo "Backup artifact 'app-debug-apk' remains fully available."

            echo "### ⚠️ Debug APK Build Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK was **built successfully** and saved as a GitHub Actions artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Note:** GitHub Release publishing could not complete. This can happen if write permissions for releases are restricted on the repository." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "📦 **Download Artifact:** Download \`app-debug-apk\` directly from the **Artifacts** section at the bottom of this Actions workflow run summary." >> "$GITHUB_STEP_SUMMARY"
          fi
